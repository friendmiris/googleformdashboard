<div class="login" id="login"><div class="loginbox"><h1>센터 현황판 로그인</h1><p class="description">내부 통계 자료입니다. 관리자 비밀번호를 입력하세요.</p><form id="loginForm" autocomplete="off"><input id="password" type="password" placeholder="관리자 비밀번호" required autocomplete="new-password" spellcheck="false"><label class="pwcheck"><input type="checkbox" id="showPassword"> 비밀번호 표시</label><button class="btn primary" type="submit">현황판 열기</button></form><div class="error" id="error"></div></div></div>
<header><div class="top"><div class="brand"><span>C</span>센터 현황 분석</div><button id="printBtn" class="btn printBtn">🖨 인쇄 / PDF 저장</button></div></header>
<main id="main" class="hide"><div class="eyebrow">CENTER ANALYTICS</div><h1>9월 센터 현황판</h1><p class="description">전체·탈락·등록 결과를 선택해 필요한 항목만 한눈에 분석하세요.</p>

<button class="status-tab" role="tab" type="button" data-mode="all" aria-selected="true"><b>전체</b><span>모든 응답과 문항</span></button>
<button class="status-tab" role="tab" type="button" data-mode="rejected" aria-selected="false"><b>탈락한 경우</b><span>반려 유형·원인 분석</span></button>
<button class="status-tab" role="tab" type="button" data-mode="registered" aria-selected="false"><b>등록된 경우</b><span>등록 결과·성공 요인</span></button></div>
<div class="tab-banner" id="tabBanner"></div>
<div class="filters"><div class="field"><label for="region">지역 선택</label><select id="region"></select></div><label for="upload" class="btn">📁 엑셀 / CSV로 임시 분석</label><input id="upload" type="file" accept=".csv,.xlsx,.xls"><button class="btn" id="reset">기본 데이터로 돌아가기</button></div>

<section id="rankingSection"><h2 id="rankingTitle">응답 순위 분석</h2><p class="section-caption" id="rankingInfo"></p><div id="summary" class="summary"></div><div class="rankgrid" id="ranking" style="margin-top:16px"></div></section>
<p class="footnote">이 화면은 2026년 11월 9일 저장된 기본 통계 또는 불러온 파일을 분석합니다. 새 구글 폼 응답은 자동으로 동기화되지 않습니다. 파일 업로드는 브라우저 안에서만 처리되며 원본 구글 스프레드시트를 변경하지 않습니다.</p></main>

<script>
'use strict';const $=id=>document.getElementById(id);const palette=['#315be8','#16a58d','#f79b4b','#a17bef','#ed6f9d','#5aabce','#b5c457','#8a92a7'];let baseData=null,uploadedData=null;
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>Number(v||0).toLocaleString('ko-KR');
function sumRows(rows,headers){return{total:rows.length,registered:rows.filter(r=>r[10]==='등록').length,returned:rows.filter(r=>String(r[10]).includes('반려')).length,counts:headers.map((name,i)=>{const count=new Map();let answered=0;const textOnly=i===12||i===13;for(const row of rows){const val=String(row[i]??'').trim();if(!val)continue;answered++;if(!textOnly)count.set(val,(count.get(val)||0)+1)}return{name,answered,textOnly,items:[...count].sort((a,b)=>b[1]-a[1]),other:0}})}}
let activeMode='all';
const viewConfig={
 all:{label:'전체 응답',intro:'공통 6개 핵심 항목과 나머지 전체 문항을 분석합니다.',common:[0,1,2,9,10,15],more:[3,4,5,6,7,8,11,12,13,14]},
 rejected:{label:'탈락한 경우',intro:'수신 미작성·수신 작성 후 반려 응답만 모아 분석합니다.',fields:[3,4,5,6,9,10,11,14,15]},
 registered:{label:'등록된 경우',intro:'등록한 응답만 모아 성공 요인과 수강생 특성을 분석합니다.',fields:[3,4,5,6,9,10,13,14,15]}
};
function mergeGroups(a,b){
 const counts=a.counts.map((item,i)=>{
  const other=b.counts[i],totals=new Map();
  for(const [name,n] of [...(item.items||[]),...(other.items||[])])totals.set(name,(totals.get(name)||0)+Number(n));
  return {name:item.name,answered:Number(item.answered||0)+Number(other.answered||0),textOnly:item.textOnly,
    items:[...totals.entries()].sort((x,y)=>y[1]-x[1]),other:Number(item.other||0)+Number(other.other||0)};
 });
 return{total:a.total+b.total,registered:a.registered+b.registered,returned:a.returned+b.returned,counts};
}
function current(){
 const groups=(uploadedData||baseData).groups,region=$('region').value;
 if(activeMode==='registered')return groups[region+'|등록'];
 if(activeMode==='rejected')return mergeGroups(groups[region+'|수신 작성후 반려'],groups[region+'|수신 미작성 반려']);
 return groups[region+'|전체'];
}
const categorizedSuccesses={"전체":{"name":"주 성공 요인 · 주제별 분류","answered":92,"items":[["친분·라포·신뢰 형성",71],["수강생 의지·동기·필요성",7],["그 외 성공 요인",7],["전도사님 관심·상담·만남",3],["교사·인도자의 지속 관리",3],["프로그램·수업·환경 영향",1]],"other":0,"textOnly":false},"본부":{"name":"주 성공 요인 · 주제별 분류","answered":34,"items":[["친분·라포·신뢰 형성",28],["수강생 의지·동기·필요성",2],["전도사님 관심·상담·만남",2],["교사·인도자의 지속 관리",1],["그 외 성공 요인",1]],"other":0,"textOnly":false},"광산":{"name":"주 성공 요인 · 주제별 분류","answered":40,"items":[["친분·라포·신뢰 형성",28],["수강생 의지·동기·필요성",4],["그 외 성공 요인",4],["교사·인도자의 지속 관리",2],["전도사님 관심·상담·만남",1],["프로그램·수업·환경 영향",1]],"other":0,"textOnly":false},"북구":{"name":"주 성공 요인 · 주제별 분류","answered":18,"items":[["친분·라포·신뢰 형성",15],["그 외 성공 요인",2],["수강생 의지·동기·필요성",1]],"other":0,"textOnly":false}};
function successFactors(){
 if(!uploadedData)return categorizedSuccesses[$('region').value]||categorizedSuccesses['전체'];
 return uploadedData.successFactors?.[$('region').value]||{name:'주 성공 요인',answered:0,items:[],textOnly:false};
}
function pie(name,s,maxItems=7){let heading='<h3>'+safe(name)+'</h3>';if(!s||!s.answered)return `<article class="panel">${heading}<p class="meta">응답 0건</p><div class="empty">표시할 응답이 없습니다.</div></article>`;if(s.textOnly)return `<article class="panel">${heading}<p class="meta">자유서술형 · 응답 원문 비공개</p><div class="empty"><div style="text-align:center"><strong style="font-size:35px;color:#315be8">${fmt(s.answered)}건</strong><p>서술형 응답이 수집되었습니다.</p></div></div></article>`;
const items=s.items||[],main=items.slice(0,maxItems),others=items.slice(maxItems).reduce((n,x)=>n+Number(x[1]||0),Number(s.other||0)),list=others?[...main,['기타',others]]:main;const length=2*Math.PI*77;let used=0;let circles='<circle cx="110" cy="110" r="77" fill="none" stroke="#eef2f7" stroke-width="35"/>';let legend='';list.forEach(([label,n],i)=>{const pct=Number(n)/s.answered*100,part=Number(n)/s.answered*length,color=palette[i%palette.length],tip=label+' · '+fmt(n)+'건 ('+pct.toFixed(1)+'%)';if(part>0){circles+='<circle class="slice" tabindex="0" data-tooltip="'+safe(tip)+'" aria-label="'+safe(tip)+'" cx="110" cy="110" r="77" fill="none" stroke="'+color+'" stroke-width="35" stroke-dasharray="'+part.toFixed(4)+' '+length.toFixed(4)+'" stroke-dashoffset="'+(-used).toFixed(4)+'" transform="rotate(-90 110 110)"><title>'+safe(tip)+'</title></circle>';used+=part}legend+='<div class="legendline"><i class="swatch" style="background:'+color+'"></i><span class="key">'+safe(label)+'</span><strong>'+fmt(n)+' <small>('+Math.round(pct)+'%)</small></strong></div>'});return '<article class="panel">'+heading+'<p class="meta">응답 '+fmt(s.answered)+'건 · 항목 '+items.length+'개</p><div class="chartbody"><div class="donut"><svg viewBox="0 0 220 220" aria-label="'+safe(name)+' 원그래프" role="img">'+circles+'</svg><div class="center"><b>'+fmt(s.answered)+'</b><small>유효 응답</small></div></div><div class="legend">'+legend+'</div></div></article>'}
function ranking(name,s){const rows=s.items||[];return '<article class="ranking"><h3>'+safe(name)+'</h3><p class="meta">'+fmt(s.answered)+'건 응답 · '+rows.length+'개 항목</p>'+(rows.length?rows.map(([val,n],i)=>{const pct=s.answered?Number(n)/s.answered*100:0;return '<div class="rankrow"><span class="rank">'+(i+1)+'위</span><div class="rankcontent"><div class="ranktop"><span>'+safe(val)+'</span><b>'+fmt(n)+'건 ('+pct.toFixed(1)+'%)</b></div><div class="bar"><div style="width:'+pct+'%;background:'+palette[i%palette.length]+'"></div></div></div></div>'}).join(''):'<p class="meta">응답 없음</p>')+'</article>'}
function selectedPie(index,d,label){
 const title=label||d.counts[index].name;
 if(index===13&&activeMode==='registered'){
   const ss=successFactors();return pie(title,ss,8);
 }

}
function render(){
 const d=current(),cfg=viewConfig[activeMode],source=uploadedData?'업로드한 파일 데이터':'기본 데이터';
 $('mode').textContent=source+' · 선택 조건 '+fmt(d.total)+'건 · 업로드는 화면 분석만 교체하며 원본 데이터는 변경하지 않습니다.';

function populate(){const d=uploadedData||baseData;for(const [key,items] of [['region',d.regions]]){const before=$(key).value;$(key).innerHTML=items.map(v=>'<option value="'+safe(v)+'">'+safe(v)+'</option>').join('');if(items.includes(before))$(key).value=before}}
function parseCSV(text){let rows=[],row=[],part='',quoted=false;text=text.replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){part+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(part);part=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(part);if(row.some(Boolean))rows.push(row);row=[];part=''}else part+=c}row.push(part);if(row.some(Boolean))rows.push(row);return rows}
function successCategory(text){
 const s=String(text||'').toLowerCase();
 const categories=[
 ['친분·라포·신뢰 형성',['친분','라포','신뢰','친밀','관계','유대','지인','정서적','소통','친구','유대감']],
 ['수강생 의지·동기·필요성',['의지','동기','필요','갈급','변화','열정','적극','관심','배우고','배움','성장','결심','목표','수강생 본인']],
 ['전도사님 관심·상담·만남',['전도사','상담','면담','면접','1:1','일대일','일대 일','만남']],
 ['교사·인도자의 지속 관리',['관리','꾸준','지속','연락','교사','인도자','케어','피드백','설득','참여 독려']],
 ['프로그램·수업·환경 영향',['프로그램','수업','컨텐츠','콘텐츠','강의','활동','환경','시기','시간','복음방']]
 ];
 for(const [label,keywords] of categories)if(keywords.some(word=>s.includes(word)))return label;
 return '그 외 성공 요인';
}
function fromTable(table){const cols=table[0].map(v=>String(v).trim()),expected=baseData.headers,offset=expected.map(name=>cols.findIndex(x=>x.toLowerCase()===name.toLowerCase()));if(offset[0]<0||offset[10]<0)throw Error('시트1의 지역·수강생 상태 현황 열이 필요해요.');const rows=table.slice(1).filter(r=>r[offset[0]]&&r[offset[0]]!=='지역').map(r=>offset.map(i=>i<0?'':r[i]??''));if(!rows.length)throw Error('유효한 응답이 없습니다.');const groups={};for(const region of baseData.regions)for(const status of baseData.statuses){groups[region+'|'+status]=sumRows(rows.filter(r=>(region==='전체'||r[0]===region)&&(status==='전체'||r[10]===status)),expected)}const successFactors={};for(const region of baseData.regions){const subset=rows.filter(r=>(region==='전체'||r[0]===region)&&r[10]==='등록'),counter=new Map();for(const row of subset){const val=String(row[13]||'').trim();if(!val)continue;const type=successCategory(val);counter.set(type,(counter.get(type)||0)+1)}successFactors[region]={name:'주 성공 요인 · 주제별 분류',answered:[...counter.values()].reduce((n,x)=>n+x,0),items:[...counter.entries()].sort((a,b)=>b[1]-a[1]),textOnly:false}}return{regions:baseData.regions,statuses:baseData.statuses,groups,successFactors}}

const fromBase64=value=>Uint8Array.from(atob(value),ch=>ch.charCodeAt(0));
async function unlockDashboard(password){
  if(!window.crypto||!crypto.subtle)throw Error('HTTPS에서 접속해 주세요.');
  const input=new TextEncoder().encode(password.trim());
  const passwordKey=await crypto.subtle.importKey('raw',input,'PBKDF2',false,['deriveKey']);
  const derivedKey=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromBase64(bundledEncryptedData.salt),iterations:200000,hash:'SHA-256'},passwordKey,{name:'AES-GCM',length:256},false,['decrypt']);
  let plain;
  try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromBase64(bundledEncryptedData.iv)},derivedKey,fromBase64(bundledEncryptedData.cipher))}
  catch{throw Error('비밀번호가 맞지 않습니다.');}
  return JSON.parse(new TextDecoder().decode(plain));
}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('error').textContent='';
  const button=$('loginForm').querySelector('button[type=submit]');button.disabled=true;button.textContent='확인 중…';
  try{
    baseData=await unlockDashboard($('password').value);
    $('login').classList.add('hide');$('main').classList.remove('hide');populate();render();
  }catch(err){$('error').textContent=err.message}
  finally{button.disabled=false;button.textContent='현황판 열기'}
});
$('region').addEventListener('change',render);document.getElementById('statusTabs').addEventListener('click',event=>{const target=event.target.closest('button[data-mode]');if(target){activeMode=target.dataset.mode;render()}});$('reset').addEventListener('click',()=>{uploadedData=null;$('upload').value='';populate();render()});$('printBtn').addEventListener('click',()=>window.print());
$('upload').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{let rows;if(/\.csv$/i.test(f.name)){rows=parseCSV(await f.text())}else{if(!window.XLSX)throw Error('엑셀 처리 라이브러리를 불러오지 못했습니다. CSV를 사용해 주세요.');const book=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:''})}uploadedData=fromTable(rows);populate();render()}catch(err){alert('파일 불러오기 실패: '+err.message);$('upload').value=''}});
const tip=$('tooltip');function tipMove(e){if(tip.hidden||!Number.isFinite(e.clientX))return;tip.style.left=Math.max(8,Math.min(e.clientX+15,innerWidth-tip.offsetWidth-12))+'px';tip.style.top=Math.max(8,Math.min(e.clientY+15,innerHeight-tip.offsetHeight-12))+'px'}function tipShow(e,el){tip.textContent=el.dataset.tooltip;tip.hidden=false;tipMove(e)}document.addEventListener('pointerover',e=>{const el=e.target.closest?.('.slice');if(el)tipShow(e,el)});document.addEventListener('pointermove',e=>tipMove(e));document.addEventListener('pointerout',e=>{if(e.target.closest?.('.slice'))tip.hidden=true});document.addEventListener('focusin',e=>{const el=e.target.closest?.('.slice');if(el){const b=el.getBoundingClientRect();tipShow({clientX:b.left+b.width/2,clientY:b.top+b.height/2},el)}});document.addEventListener('focusout',e=>{if(e.target.closest?.('.slice'))tip.hidden=true});document.addEventListener('click',e=>{const el=e.target.closest?.('.slice');if(el)tipShow(e,el);else tip.hidden=true});
$('password').value='';$('showPassword').addEventListener('change',()=>{$('password').type=$('showPassword').checked?'text':'password'});
