<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>9월 센터 현황 분석</title>
<style>
:root{--text:#10233e;--muted:#687a94;--blue:#315be8;--line:#e2e9f2;--back:#f6f8fb}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);background:white;font:17px/1.55 system-ui,'Malgun Gothic',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5}.hide{display:none!important}header{position:sticky;top:0;z-index:6;background:white;border-bottom:1px solid var(--line)}.top{max-width:1430px;margin:auto;padding:15px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:23px;font-weight:850;letter-spacing:-.7px}.brand span{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#315be8;color:white;margin-right:10px}.btn{border:1px solid var(--line);background:white;padding:11px 17px;border-radius:12px;color:var(--text);font-weight:750;min-height:47px}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn:hover{filter:brightness(.97)}main{max-width:1430px;padding:27px 24px 90px;margin:auto}.eyebrow{font-size:13px;color:var(--blue);font-weight:900;letter-spacing:1px}h1{font-size:38px;letter-spacing:-1.5px;line-height:1.25;margin:7px 0}h2{font-size:27px;margin:0 0 17px}h3{font-size:20px;letter-spacing:-.3px;margin:0}.description,.meta{color:var(--muted)}.description{margin:8px 0 22px}.meta{font-size:14px;margin:3px 0 17px}.filters{padding:15px 18px;background:var(--back);border:1px solid var(--line);border-radius:18px;display:flex;flex-wrap:wrap;gap:14px;align-items:end}.field{display:grid;gap:6px;flex:1;min-width:150px}.field label{font-size:14px;font-weight:800;color:#536681}select{border:1px solid #d9e2ec;background:white;padding:11px 12px;border-radius:10px;color:var(--text);min-height:49px}input[type=file]{display:none}.note{font-size:14px;color:#70829a;margin:14px 0 24px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.kpi{border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 4px 15px #11274806}.kpi span{color:#61748e;font-size:15px;font-weight:750}.kpi b{display:block;color:var(--blue);font-size:43px;letter-spacing:-1px;margin:3px 0}.kpi small{color:#8c9ab0}section{margin-top:38px}.chartgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.panel{border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0;break-inside:avoid}.chartbody{display:flex;align-items:center;gap:20px}.donut{width:196px;height:196px;position:relative;flex-shrink:0}.donut svg{width:100%;height:100%;display:block;overflow:visible}.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}.center b{font-size:31px}.center small{font-size:12px;color:#8191a8}.legend{flex:1;min-width:0;display:grid;gap:9px}.legendline{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:start;font-size:14px}.swatch{width:10px;height:10px;border-radius:50%;margin-top:6px}.key{white-space:normal;overflow-wrap:anywhere;word-break:keep-all;line-height:1.55;color:#4c607c}.legendline strong{font-size:14px;white-space:nowrap}.legendline small{font-weight:500;color:#8191a8}.empty{min-height:160px;display:flex;align-items:center;justify-content:center;color:#75869d;text-align:center}.rankgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.ranking{border:1px solid var(--line);padding:21px;border-radius:18px;break-inside:avoid}.rankrow{display:flex;align-items:center;gap:10px;margin:13px 0}.rank{min-width:35px;border-radius:8px;background:#eaf0ff;text-align:center;color:var(--blue);font-size:13px;font-weight:850;padding:5px 1px}.rankcontent{min-width:0;flex:1}.ranktop{display:flex;align-items:start;justify-content:space-between;gap:12px}.ranktop span{font-size:14px;overflow-wrap:anywhere;word-break:keep-all}.ranktop b{white-space:nowrap;font-size:14px}.bar{height:6px;background:#edf1f7;border-radius:12px;margin-top:6px;overflow:hidden}.bar div{height:100%;border-radius:12px}.summary{background:#f2f6ff;border:1px solid #dbe6ff;padding:18px;border-radius:15px;color:#314969}.tooltip{position:fixed;z-index:9999;max-width:270px;background:#172943;color:white;border-radius:10px;padding:10px 13px;box-shadow:0 8px 24px #11213944;font-size:14px;font-weight:750;line-height:1.5;pointer-events:none;overflow-wrap:anywhere}.tooltip[hidden]{display:none}.slice{pointer-events:stroke;cursor:help}.slice:hover,.slice:focus{filter:brightness(1.15);outline:0}.login{position:fixed;inset:0;z-index:20;background:#f1f4f9;display:grid;place-items:center;padding:18px}.loginbox{width:min(430px,100%);background:white;border:1px solid var(--line);box-shadow:0 20px 80px #10233d15;padding:33px;border-radius:23px}.loginbox input{width:100%;padding:14px;border-radius:11px;border:1px solid #d2dce9;margin:12px 0}.loginbox button{width:100%}.error{color:#d32f55;font-size:14px;min-height:19px}.footnote{padding:15px;background:var(--back);border-radius:12px;font-size:14px;color:#6c7e95;margin-top:26px}
@media(max-width:1130px){.chartbody{flex-direction:column}.legend{width:100%}}@media(max-width:800px){.chartgrid,.rankgrid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.top{padding:12px 14px}.brand{font-size:19px}main{padding:23px 14px}.kpis{gap:9px}.kpi{padding:15px}.kpi b{font-size:30px}.panel{padding:17px}h1{font-size:30px}.donut{width:184px;height:184px}}
@page{size:A4 portrait;margin:12mm}@media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}body{font-size:13px}header{position:static}.top{padding:8px 0}.printBtn,.filters,.note,.footnote,.login,.tooltip{display:none!important}main{max-width:none;padding:7px 0}.chartgrid,.rankgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.panel,.ranking,.kpi{break-inside:avoid!important;page-break-inside:avoid!important;box-shadow:none!important}.panel{padding:12px!important}.panel h3{font-size:15px}.meta{font-size:11px;margin:2px 0 7px}.chartbody{flex-direction:column!important;gap:7px}.donut{width:123px!important;height:123px!important}.donut .center b{font-size:20px}.donut .center small{font-size:9px}.legend{gap:4px}.legendline{font-size:11px;grid-template-columns:8px minmax(0,1fr) auto;gap:5px}.legendline strong{font-size:11px}.kpi b{font-size:26px}.rankrow{margin:6px 0}.ranktop span,.ranktop b{font-size:11px}.ranking{padding:12px}}
.donut .center{pointer-events:none!important}
.donut svg{position:relative;z-index:1;pointer-events:visiblePainted}
.slice{pointer-events:stroke!important;cursor:crosshair}
.tooltip{z-index:999999!important}
</style></head><body>
<div class="login" id="login"><div class="loginbox"><h1>센터 현황판 로그인</h1><p class="description">내부 통계 자료입니다. 관리자 비밀번호를 입력하세요.</p><form id="loginForm"><input id="password" type="password" placeholder="관리자 비밀번호" required autocomplete="current-password"><button class="btn primary" type="submit">현황판 열기</button></form><div class="error" id="error"></div></div></div>
<header><div class="top"><div class="brand"><span>C</span>센터 현황 분석</div><button id="printBtn" class="btn printBtn">🖨 인쇄 / PDF 저장</button></div></header>
<main id="main" class="hide"><div class="eyebrow">CENTER ANALYTICS</div><h1>9월 센터 현황판</h1><p class="description">지역·부서별 현황과 16개 문항을 원그래프로 한눈에 확인하세요.</p>
<div class="filters"><div class="field"><label for="region">지역 선택</label><select id="region"></select></div><div class="field"><label for="status">수강생 상태</label><select id="status"></select></div><label for="upload" class="btn">📁 엑셀 / CSV로 임시 분석</label><input id="upload" type="file" accept=".csv,.xlsx,.xls"><button class="btn" id="reset">기본 데이터로 돌아가기</button></div>
<p class="note" id="mode">기본 데이터를 불러오는 중입니다.</p><div class="kpis" id="kpis"></div>
<section><h2>핵심 현황</h2><div class="chartgrid" id="featured"></div></section><section><h2>문항별 전체 분석</h2><div class="chartgrid" id="questions"></div></section><section><h2>항목별 전체 순위</h2><div id="summary" class="summary"></div><div class="rankgrid" id="ranking" style="margin-top:16px"></div></section>
<p class="footnote">이 화면은 마지막으로 등록된 기본 통계 또는 불러온 파일을 분석합니다. 새 구글 폼 응답은 자동으로 동기화되지 않습니다. 파일 업로드는 브라우저 안에서만 처리되며 원본 구글 스프레드시트를 변경하지 않습니다.</p></main>
<div id="tooltip" class="tooltip" hidden></div><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script>
'use strict';const $=id=>document.getElementById(id);const palette=['#315be8','#16a58d','#f79b4b','#a17bef','#ed6f9d','#5aabce','#b5c457','#8a92a7'];let baseData=null,uploadedData=null;
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>Number(v||0).toLocaleString('ko-KR');
function sumRows(rows,headers){return{total:rows.length,registered:rows.filter(r=>r[10]==='등록').length,returned:rows.filter(r=>String(r[10]).includes('반려')).length,counts:headers.map((name,i)=>{const count=new Map();let answered=0;const textOnly=i===12||i===13;for(const row of rows){const val=String(row[i]??'').trim();if(!val)continue;answered++;if(!textOnly)count.set(val,(count.get(val)||0)+1)}return{name,answered,textOnly,items:[...count].sort((a,b)=>b[1]-a[1]),other:0}})}}
function current(){const d=uploadedData||baseData;return d.groups[$('region').value+'|'+$('status').value]}
function pie(name,s,maxItems=7){let heading='<h3>'+safe(name)+'</h3>';if(!s||!s.answered)return `<article class="panel">${heading}<p class="meta">응답 0건</p><div class="empty">표시할 응답이 없습니다.</div></article>`;if(s.textOnly)return `<article class="panel">${heading}<p class="meta">자유서술형 · 응답 원문 비공개</p><div class="empty"><div style="text-align:center"><strong style="font-size:35px;color:#315be8">${fmt(s.answered)}건</strong><p>서술형 응답이 수집되었습니다.</p></div></div></article>`;
const items=s.items||[],main=items.slice(0,maxItems),others=items.slice(maxItems).reduce((n,x)=>n+Number(x[1]||0),Number(s.other||0)),list=others?[...main,['기타',others]]:main;const length=2*Math.PI*77;let used=0;let circles='<circle cx="110" cy="110" r="77" fill="none" stroke="#eef2f7" stroke-width="35"/>';let legend='';list.forEach(([label,n],i)=>{const pct=Number(n)/s.answered*100,part=Number(n)/s.answered*length,color=palette[i%palette.length],tip=label+' · '+fmt(n)+'건 ('+pct.toFixed(1)+'%)';if(part>0){circles+='<circle class="slice" tabindex="0" data-tooltip="'+safe(tip)+'" aria-label="'+safe(tip)+'" cx="110" cy="110" r="77" fill="none" stroke="'+color+'" stroke-width="35" stroke-dasharray="'+part.toFixed(4)+' '+length.toFixed(4)+'" stroke-dashoffset="'+(-used).toFixed(4)+'" transform="rotate(-90 110 110)"><title>'+safe(tip)+'</title></circle>';used+=part}legend+='<div class="legendline"><i class="swatch" style="background:'+color+'"></i><span class="key">'+safe(label)+'</span><strong>'+fmt(n)+' <small>('+Math.round(pct)+'%)</small></strong></div>'});return '<article class="panel">'+heading+'<p class="meta">응답 '+fmt(s.answered)+'건 · 항목 '+items.length+'개</p><div class="chartbody"><div class="donut"><svg viewBox="0 0 220 220" aria-label="'+safe(name)+' 원그래프" role="img">'+circles+'</svg><div class="center"><b>'+fmt(s.answered)+'</b><small>유효 응답</small></div></div><div class="legend">'+legend+'</div></div></article>'}
function ranking(name,s){const rows=s.items||[];return '<article class="ranking"><h3>'+safe(name)+'</h3><p class="meta">'+fmt(s.answered)+'건 응답 · '+rows.length+'개 항목</p>'+(rows.length?rows.map(([val,n],i)=>{const pct=s.answered?Number(n)/s.answered*100:0;return '<div class="rankrow"><span class="rank">'+(i+1)+'위</span><div class="rankcontent"><div class="ranktop"><span>'+safe(val)+'</span><b>'+fmt(n)+'건 ('+pct.toFixed(1)+'%)</b></div><div class="bar"><div style="width:'+pct+'%;background:'+palette[i%palette.length]+'"></div></div></div></div>'}).join(''):'<p class="meta">응답 없음</p>')+'</article>'}
function render(){const d=current(),source=uploadedData?'업로드 파일 데이터':'기본 데이터';$('mode').textContent=source+' · 전체 '+fmt(d.total)+'건 · 엑셀을 불러오면 화면 내용만 임시 교체되며 기존 응답은 변경되지 않습니다.';const metrics=[['전체 응답',fmt(d.total)+'건'],['등록',fmt(d.registered)+'건'],['반려',fmt(d.returned)+'건'],['등록률',(d.total?(d.registered/d.total*100).toFixed(1):'0.0')+'%']];$('kpis').innerHTML=metrics.map(([label,val])=>'<div class="kpi"><span>'+label+'</span><b>'+val+'</b><small>선택한 지역·상태 기준</small></div>').join('');$('featured').innerHTML=[0,10,6,3].map(i=>pie(d.counts[i].name,d.counts[i],6)).join('');$('questions').innerHTML=d.counts.map((s,i)=>pie((i+1)+'. '+s.name,s,7)).join('');$('summary').textContent='전체 '+fmt(d.total)+'건 · 등록 '+fmt(d.registered)+'건 · 반려 '+fmt(d.returned)+'건 · 등록률 '+(d.total?(d.registered/d.total*100).toFixed(1):'0.0')+'%';$('ranking').innerHTML=[[6,'섭외유형 전체 순위'],[4,'MBTI 전체 순위'],[11,'반려 사유 전체 순위'],[0,'지역별 응답 순위'],[2,'교사 등급 전체 순위']].map(([i,name])=>ranking(name,d.counts[i])).join('')}
function populate(){const d=uploadedData||baseData;for(const [key,items] of [['region',d.regions],['status',d.statuses]]){const before=$(key).value;$(key).innerHTML=items.map(v=>'<option value="'+safe(v)+'">'+safe(v)+'</option>').join('');if(items.includes(before))$(key).value=before}}
function parseCSV(text){let rows=[],row=[],part='',quoted=false;text=text.replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){part+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(part);part=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(part);if(row.some(Boolean))rows.push(row);row=[];part=''}else part+=c}row.push(part);if(row.some(Boolean))rows.push(row);return rows}
function fromTable(table){const cols=table[0].map(v=>String(v).trim()),expected=baseData.headers,offset=expected.map(name=>cols.findIndex(x=>x.toLowerCase()===name.toLowerCase()));if(offset[0]<0||offset[10]<0)throw Error('시트1의 지역·수강생 상태 현황 열이 필요해요.');const rows=table.slice(1).filter(r=>r[offset[0]]&&r[offset[0]]!=='지역').map(r=>offset.map(i=>i<0?'':r[i]??''));if(!rows.length)throw Error('유효한 응답이 없습니다.');const groups={};for(const region of baseData.regions)for(const status of baseData.statuses){groups[region+'|'+status]=sumRows(rows.filter(r=>(region==='전체'||r[0]===region)&&(status==='전체'||r[10]===status)),expected)}return{regions:baseData.regions,statuses:baseData.statuses,groups}}
async function init(){const res=await fetch('/api/data',{cache:'no-store'});if(res.status===401)return;if(!res.ok)throw Error('데이터 불러오기 실패');baseData=await res.json();$('login').classList.add('hide');$('main').classList.remove('hide');populate();render()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('error').textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});if(!r.ok)throw Error('비밀번호가 맞지 않습니다.');await init()}catch(err){$('error').textContent=err.message}});$('region').addEventListener('change',render);$('status').addEventListener('change',render);$('reset').addEventListener('click',()=>{uploadedData=null;$('upload').value='';populate();render()});$('printBtn').addEventListener('click',()=>window.print());
$('upload').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{let rows;if(/\.csv$/i.test(f.name)){rows=parseCSV(await f.text())}else{if(!window.XLSX)throw Error('엑셀 처리 라이브러리를 불러오지 못했습니다. CSV를 사용해 주세요.');const book=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:''})}uploadedData=fromTable(rows);populate();render()}catch(err){alert('파일 불러오기 실패: '+err.message);$('upload').value=''}});
const tip=$('tooltip');function tipMove(e){if(tip.hidden||!Number.isFinite(e.clientX))return;tip.style.left=Math.max(8,Math.min(e.clientX+15,innerWidth-tip.offsetWidth-12))+'px';tip.style.top=Math.max(8,Math.min(e.clientY+15,innerHeight-tip.offsetHeight-12))+'px'}function tipShow(e,el){tip.textContent=el.dataset.tooltip;tip.hidden=false;tipMove(e)}document.addEventListener('pointerover',e=>{const el=e.target.closest?.('.slice');if(el)tipShow(e,el)});document.addEventListener('pointermove',e=>tipMove(e));document.addEventListener('pointerout',e=>{if(e.target.closest?.('.slice'))tip.hidden=true});document.addEventListener('focusin',e=>{const el=e.target.closest?.('.slice');if(el){const b=el.getBoundingClientRect();tipShow({clientX:b.left+b.width/2,clientY:b.top+b.height/2},el)}});document.addEventListener('focusout',e=>{if(e.target.closest?.('.slice'))tip.hidden=true});document.addEventListener('click',e=>{const el=e.target.closest?.('.slice');if(el)tipShow(e,el);else tip.hidden=true});
init().catch(e=>{$('error').textContent=e.message});
</script></body></html>
